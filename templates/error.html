<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Validación requerida | Clínica Visual</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:linear-gradient(135deg,#0b1b33,#0e7490)}
.c{max-width:480px;width:100%;background:#fff;border-radius:24px;padding:32px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.35)}
.i{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:#fee2e2;font-size:30px}
h1{margin:0;font-size:20px;font-weight:800;color:#0f172a}
.m{margin:16px 0 22px;padding:14px;border-radius:14px;border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;font-weight:600}
a{display:inline-block;padding:12px 22px;border-radius:12px;background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff;font-weight:700;text-decoration:none}a:hover{filter:brightness(1.08)}</style></head>
<body><section class="c"><div class="i">⚠️</div><h1>No fue posible completar la operación</h1><p class="m">{{ alerta }}</p><a href="{{ volver_a }}">← Volver al formulario</a></section></body></html>
