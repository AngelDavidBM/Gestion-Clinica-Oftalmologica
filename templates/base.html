<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<title>{% block titulo %}Citas Oftalmológicas{% endblock %}</title>
<style>
:root{--ink:#0b1b33;--ink2:#12294a;--acc:#0ea5e9;--acc2:#14b8a6;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh}
.side{width:250px;flex:none;background:linear-gradient(180deg,var(--ink),var(--ink2));color:#cbd5e1;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;color:#fff;font-weight:800;font-size:18px;text-decoration:none}
.brand i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));font-style:normal;font-size:20px}
.side small{display:block;font-weight:500;font-size:11px;color:#7dd3fc;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px;overflow:auto;flex:1}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:transparent;color:#cbd5e1;font-weight:600;font-size:14px;font-family:inherit;text-align:left;cursor:pointer;transition:.15s}
.nav-btn span{font-size:18px;width:24px;text-align:center}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.activo{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 6px 16px rgba(14,165,233,.35)}
.salir{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:transparent;color:#fecaca;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.salir:hover{background:rgba(239,68,68,.18)}
.main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:16px 28px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:20px;font-weight:800}
.menu-mov{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:18px;cursor:pointer}
.rol{padding:6px 12px;border-radius:999px;background:#e0f2fe;color:#075985;font-size:12px;font-weight:700}
.wrap{padding:24px 28px 48px;max-width:1180px}
.vista{animation:ent .25s ease}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h2{margin:0 0 4px;font-size:17px;font-weight:800}
.card h3{margin:16px 0 6px;font-size:14px;font-weight:700}
.sub{margin:0 0 16px;font-size:13px;color:var(--mut)}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.kpi{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi b{display:block;font-size:26px;line-height:1}
.kpi em{font-style:normal;font-size:12px;color:var(--mut)}
.kpi i{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;font-style:normal;font-size:22px}
.k-sky i{background:#e0f2fe}.k-amb i{background:#fef3c7}.k-ok i{background:#d1fae5}.k-red i{background:#fee2e2}.k-vio i{background:#ede9fe}
.atajos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.atajo{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff;font-weight:700;font-size:14px;font-family:inherit;color:var(--txt);cursor:pointer;text-align:left;transition:.15s}
.atajo:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 8px 20px rgba(14,165,233,.15)}
.atajo span{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#e0f2fe,#ccfbf1);font-size:20px}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fg .full{grid-column:1/-1}
.lbl{display:block;font-size:12px;font-weight:700;color:#334155}
.inp{width:100%;margin-top:5px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:14px;font-family:inherit;color:var(--txt);transition:.15s}
.inp:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px rgba(14,165,233,.15)}
.inp.border-red-500{border-color:#ef4444!important;box-shadow:0 0 0 4px rgba(239,68,68,.12)}
.inp-sm{padding:8px 10px;font-size:13px;margin-top:0;width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:0;border-radius:12px;font-weight:700;font-size:13px;font-family:inherit;color:#fff;cursor:pointer;text-decoration:none;transition:.15s;list-style:none}
.btn::-webkit-details-marker{display:none}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07);box-shadow:0 6px 14px rgba(15,23,42,.18)}
.btn-p{background:linear-gradient(135deg,#0284c7,#0ea5e9)}
.btn-ok{background:linear-gradient(135deg,#059669,#10b981)}
.btn-v{background:linear-gradient(135deg,#6d28d9,#8b5cf6)}
.btn-w{background:linear-gradient(135deg,#d97706,#f59e0b)}
.btn-d{background:linear-gradient(135deg,#dc2626,#ef4444)}
.btn-g{background:#334155}
.btn-l{background:#f1f5f9;color:#334155;border:1px solid var(--line)}
.btn-sm{padding:7px 12px;font-size:12px}
.btn-bloque{width:100%}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#f1f5f9;color:#334155}
.chip-sky{background:#e0f2fe;color:#075985}.chip-amber{background:#fef3c7;color:#92400e}.chip-emerald{background:#d1fae5;color:#065f46}.chip-red{background:#fee2e2;color:#991b1b}.chip-violet{background:#ede9fe;color:#5b21b6}
.item{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;transition:.15s}
.item:hover{border-color:#bae6fd;box-shadow:0 6px 18px rgba(15,23,42,.06)}
.lista{display:grid;gap:12px}
.fila{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.panel-acc{margin-top:10px;padding:12px;border-radius:14px;background:#f8fafc;border:1px dashed #cbd5e1}
.panel-acc form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.det{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:10px;padding:14px;border-radius:14px;background:#f8fafc;font-size:13px}
.det dt{color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.det dd{margin:2px 0 0;font-weight:600}
.vacio{padding:22px;text-align:center;border:2px dashed var(--line);border-radius:16px;color:var(--mut);font-size:14px}
.slot{padding:10px;border:1px solid #bae6fd;border-radius:12px;background:#f0f9ff;font-weight:700;font-size:13px;font-family:inherit;color:#075985;cursor:pointer;transition:.15s}
.slot:hover{background:#e0f2fe;transform:translateY(-1px)}
.slot.sel{background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff;border-color:transparent}
.slot-busy{padding:10px;border:1px solid #fecaca;border-radius:12px;background:#fef2f2;color:#f87171;font-weight:600;font-size:13px;font-family:inherit;text-decoration:line-through;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.zona{padding:16px;border:2px dashed #cbd5e1;border-radius:16px;background:#f8fafc}
.tabla{width:100%;border-collapse:collapse;font-size:13px;text-align:left}
.tabla th{padding:10px;background:#f1f5f9;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#475569}
.tabla td{padding:10px;border-top:1px solid var(--line)}
.alerta{margin-bottom:18px;padding:14px 16px;border-radius:14px;border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;font-weight:600}
.aviso{padding:14px;border-radius:14px;border:1px solid #fde68a;background:#fffbeb}
.aviso p{margin:0 0 8px;font-size:13px;font-weight:700;color:#92400e}
details>summary{cursor:pointer}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#334155}
@media(max-width:860px){
.app{display:block}
.side{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:.25s;width:270px}
.side.abierto{transform:none;box-shadow:0 0 0 100vmax rgba(15,23,42,.45)}
.menu-mov{display:block}
.top,.wrap{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="lateral">
  <a class="brand" href="/login"><i>👁️</i><div>Clínica Visual<small>{% block rol %}Panel{% endblock %}</small></div></a>
  <nav class="nav">{% block menu %}{% endblock %}</nav>
  <form action="/logout" method="post"><button class="salir"><span>🚪</span> Menú principal / Salir</button></form>
</aside>
<div class="main">
  <header class="top">
    <div style="display:flex;align-items:center;gap:12px"><button class="menu-mov" type="button" id="abrir-menu" aria-label="Menú">☰</button><h1 id="titulo-vista">{% block encabezado %}Clínica Visual{% endblock %}</h1></div>
    <span class="rol">{{ self.rol() }}</span>
  </header>
  <main class="wrap">
    {% if alerta %}<div class="alerta">⚠️ {{ alerta }}</div>{% endif %}
    {% block contenido %}{% endblock %}
  </main>
</div>
</div>
<script>
document.querySelectorAll('input[required]').forEach(c=>c.addEventListener('input',()=>c.classList.toggle('border-red-500',!c.checkValidity())));
(function(){
const vistas=[...document.querySelectorAll('.vista')],navs=[...document.querySelectorAll('.nav-btn')],lateral=document.getElementById('lateral'),titulo=document.getElementById('titulo-vista');
if(!vistas.length)return;
function ir(id,guardar){if(!document.getElementById(id)||!vistas.some(v=>v.id===id))id=vistas[0].id;vistas.forEach(v=>v.hidden=v.id!==id);navs.forEach(b=>b.classList.toggle('activo',b.dataset.ir===id));const activo=navs.find(b=>b.dataset.ir===id);if(activo)titulo.textContent=activo.dataset.titulo||activo.textContent.trim();if(guardar)history.replaceState(null,'','#'+id);lateral.classList.remove('abierto');window.scrollTo({top:0});}
document.querySelectorAll('[data-ir]').forEach(b=>b.addEventListener('click',()=>ir(b.dataset.ir,true)));
document.getElementById('abrir-menu').addEventListener('click',()=>lateral.classList.toggle('abierto'));
document.addEventListener('click',e=>{if(lateral.classList.contains('abierto')&&!lateral.contains(e.target)&&e.target.id!=='abrir-menu')lateral.classList.remove('abierto');});
ir(location.hash.slice(1),false);
})();
</script>
</body>
</html>
